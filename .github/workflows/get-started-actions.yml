name: Get started with GitHub Actions

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Syntax check main.py
        run: python -m py_compile main.py
